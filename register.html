<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">

            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-user-plus"></i>
                </div>

                <h1>Student Registration</h1>
                <p>Create your account for the attendance system</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID / Roll No.</label>
                    <input type="text" id="studentId" placeholder="Enter your student ID or roll no.">
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester">
                        <option value="">Select semester</option>
                        <option value="1st">1st Semester</option>
                        <option value="2nd">2nd Semester</option>
                        <option value="3rd">3rd Semester</option>
                        <option value="4th">4th Semester</option>
                        <option value="5th">5th Semester</option>
                        <option value="6th">6th Semester</option>
                        <option value="7th">7th Semester</option>
                        <option value="8th">8th Semester</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="section">Section</label>
                    <select id="section">
                        <option value="">Select section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                    </select>
                </div>

                <div class="form-group">
                 <label for="gmail">Gmail</label>
                   <input type="text" id="gmail" placeholder="Enter your Gmail address">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>

                <button type="submit" class="login-button">
                    Register
                </button>

                <p id="registerMessage"></p>

            </form>

            <div class="register-link">
                <p>Already have an account?</p>
                <a href="index.html">Back to Login</a>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
